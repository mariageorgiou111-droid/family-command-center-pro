name: Remove Visible Newlines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Remove visible newline text
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          original = text

          # Remove ONLY literal \n text at the very start of the HTML.
          # This does not touch real line breaks elsewhere in the file.
          count = 0
          while text.startswith("\\n"):
              text = text[2:]
              count += 1

          if count == 0:
              raise RuntimeError("No literal \\\\n found at start of index.html")

          path.write_text(text, encoding="utf-8")

          print(f"Removed {count} literal \\\\n sequence(s) from start of index.html")
          print("No other app code was changed.")

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove visible newline text"
          git push origin HEAD:main
