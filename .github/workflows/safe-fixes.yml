name: Safe Fixes

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -c "from pathlib import Path; p=Path('index.html'); t=p.read_text(); print(p.stat().st_size); print('mealDay',t.count('mealDay')); print('fccDateFmt',t.count('fccDateFmt')); print('finance-mobile-fix',t.count('finance-mobile-fix'))"
