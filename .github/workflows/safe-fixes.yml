name: Remove Visible Newlines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Replace only the two literal newline sequences
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          pattern = r'(</style>)\\n\\n(?=<style\b)'

          matches = list(re.finditer(pattern, text))
          print("MATCHES FOUND:", len(matches))

          if len(matches) != 2:
              raise RuntimeError(
                  f"Safety stop: expected exactly 2 matches, found {len(matches)}"
              )

          fixed, count = re.subn(
              pattern,
              r'\1\n\n',
              text
          )

          if count != 2:
              raise RuntimeError(
                  f"Safety stop: expected 2 replacements, made {count}"
              )

          path.write_text(fixed, encoding="utf-8")

          print("SUCCESS: replaced exactly 2 literal newline sequences.")

      - name: Verify cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          text = Path("index.html").read_text(encoding="utf-8")
          remaining = len(
              re.findall(r'(</style>)\\n\\n(?=<style\b)', text)
          )

          print("REMAINING MATCHES:", remaining)

          if remaining != 0:
              raise RuntimeError("Cleanup verification failed.")

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 1
          fi

          git add index.html
          git commit -m "Remove visible newline text"
          git push
