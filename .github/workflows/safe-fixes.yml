name: Remove Visible Newlines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Remove only the two inspected literal newline sequences
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          literal = r'\n\n'

          positions = []
          start = 0

          while True:
              pos = text.find(literal, start)
              if pos == -1:
                  break
              positions.append(pos)
              start = pos + len(literal)

          print("LITERAL NEWLINE COUNT:", len(positions))
          print("POSITIONS:", positions)

          if len(positions) != 2:
              raise RuntimeError(
                  f"Safety stop: expected exactly 2 literal newline sequences, found {len(positions)}"
              )

          for pos in positions:
              context = text[max(0, pos - 500):pos + 500].lower()

              if "spring" not in context:
                  raise RuntimeError(
                      f"Safety stop: occurrence at {pos} is not in Spring CSS context"
                  )

          fixed = text.replace(literal, "\n\n")

          if len(fixed) >= len(text):
              raise RuntimeError(
                  "Safety stop: replacement did not reduce file length"
              )

          path.write_text(fixed, encoding="utf-8")

          print("SUCCESS: removed exactly 2 visible literal newline sequences")

      - name: Verify cleanup
        shell: python
        run: |
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          remaining = text.count(r'\n\n')

          print("REMAINING LITERAL NEWLINE COUNT:", remaining)

          if remaining != 0:
              raise RuntimeError("Cleanup verification failed")

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 1
          fi

          git add index.html
          git commit -m "Remove visible newline text"
          git push
