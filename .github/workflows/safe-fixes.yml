name: Inspect Visible Newlines

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Locate literal newline text
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          needle = "\\n"
          positions = []

          start = 0
          while True:
              pos = text.find(needle, start)
              if pos == -1:
                  break
              positions.append(pos)
              start = pos + len(needle)

          print("INDEX BYTES:", len(text.encode("utf-8")))
          print("LITERAL \\\\n COUNT:", len(positions))

          if not positions:
              print("No literal \\\\n sequences found anywhere in index.html")
          else:
              for number, pos in enumerate(positions, 1):
                  left = max(0, pos - 120)
                  right = min(len(text), pos + 120)

                  context = text[left:right]
                  context = context.replace("\r", "\\r")
                  context = context.replace("\n", "\\n")

                  print("")
                  print(f"--- MATCH {number} ---")
                  print("POSITION:", pos)
                  print("CONTEXT:")
                  print(context)

          print("")
          print("INSPECTION COMPLETE")
          print("NO FILES WERE MODIFIED")
