name: Remove Visible Newlines FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Remove the two visible newline sequences
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          # Build literal "\n\n" without escape ambiguity
          bs = chr(92)
          target = bs + "n" + bs + "n"

          positions = []
          start = 0

          while True:
              pos = text.find(target, start)
              if pos == -1:
                  break
              positions.append(pos)
              start = pos + len(target)

          print("FOUND:", len(positions))
          print("POSITIONS:", positions)

          if len(positions) != 2:
              raise RuntimeError(
                  f"Safety stop: expected exactly 2, found {len(positions)}"
              )

          # Both occurrences must belong to Spring CSS
          for pos in positions:
              context = text[max(0, pos - 600):pos + 600].lower()
              if "spring" not in context:
                  raise RuntimeError(
                      f"Safety stop: occurrence at {pos} is outside Spring CSS"
                  )

          fixed = text.replace(target, "\n\n")

          path.write_text(fixed, encoding="utf-8")

          print("SUCCESS: removed both visible newline sequences")

      - name: Verify cleanup
        shell: python
        run: |
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          bs = chr(92)
          target = bs + "n" + bs + "n"

          remaining = text.count(target)
          print("REMAINING:", remaining)

          if remaining != 0:
              raise RuntimeError(
                  f"Verification failed: {remaining} remain"
              )

          print("VERIFIED: cleanup complete")

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 1
          fi

          git commit -m "Remove visible newline text"
          git push
