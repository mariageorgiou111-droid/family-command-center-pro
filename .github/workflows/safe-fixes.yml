name: Remove Visible Newlines FINAL 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Remove only the two verified Spring CSS literals
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          # Literal backslash followed by lowercase n.
          target = chr(92) + "n"

          positions = []
          start = 0

          while True:
              pos = text.find(target, start)
              if pos == -1:
                  break
              positions.append(pos)
              start = pos + len(target)

          print("ALL LITERAL BACKSLASH-N COUNT:", len(positions))
          print("ALL POSITIONS:", positions)

          # Keep only occurrences around Spring CSS.
          spring_positions = []

          for pos in positions:
              context = text[max(0, pos - 800):pos + 800].lower()

              if "spring" in context and "style" in context:
                  spring_positions.append(pos)

          print("SPRING CANDIDATES:", spring_positions)

          if len(spring_positions) != 2:
              raise RuntimeError(
                  "Safety stop: expected exactly 2 Spring candidates, "
                  f"found {len(spring_positions)}"
              )

          # Remove ONLY those two characters "\n".
          # Work right-to-left so positions stay valid.
          fixed = text

          for pos in reversed(spring_positions):
              fixed = fixed[:pos] + fixed[pos + 2:]

          if len(text) - len(fixed) != 4:
              raise RuntimeError(
                  "Safety stop: expected exactly 4 characters removed"
              )

          path.write_text(fixed, encoding="utf-8")

          print("SUCCESS: removed exactly two literal backslash-n sequences")

      - name: Verify
        shell: python
        run: |
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          target = chr(92) + "n"

          remaining = []

          start = 0
          while True:
              pos = text.find(target, start)
              if pos == -1:
                  break

              context = text[max(0, pos - 800):pos + 800].lower()

              if "spring" in context and "style" in context:
                  remaining.append(pos)

              start = pos + len(target)

          print("REMAINING SPRING CANDIDATES:", remaining)

          if remaining:
              raise RuntimeError("Verification failed")

          print("VERIFIED")

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No index.html change detected"
            exit 1
          fi

          git commit -m "Remove visible newline artifacts"
          git push
